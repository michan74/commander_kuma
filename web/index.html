<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bearstro</title>
<style>
  /* カラーパレット(森×都市のモダン)。色変更は基本ここだけで済むよう変数化 */
  :root {
    --leaves: #506D2F; --bark: #2A2922; --marble: #F3EBDD; --brown: #7D5642;
    --accent: #506D2F; --accent-dark: #3c531f; --accent-light: #6b8f42;
    --review-bg: #e3ead5;  /* 調節中と分かる薄いleaves */
    --bg: var(--marble); --text: var(--bark);  /* アプリ背景テーマ(切替可) */
  }
  body.theme-leaves { --bg: var(--leaves); --text: var(--marble); }  /* 森テーマ(暗) */
  body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }

  /* アップロード画面 */
  #upload { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 20px; text-align: center; padding: 24px; }
  #upload h1 { margin: 0; font-size: 34px; }
  #upload p.sub { color: #666; margin: 0; }
  .card { background: var(--bark); border: 1px solid #333; border-radius: 12px; padding: 28px 32px;
          display: flex; flex-direction: column; gap: 16px; min-width: 320px; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px 18px;
         font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn.sub { background: #333; color: #eee; font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: default; }
  #up-status { color: var(--accent); min-height: 20px; }
  #library { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 720px; }
  #library h3 { width: 100%; margin: 4px 0; color: #666; font-size: 14px; }
  .piece-card { background: var(--bark); border: 1px solid #333; border-radius: 8px; padding: 8px;
                width: 140px; cursor: pointer; text-align: center; }
  .piece-card:hover { border-color: var(--accent); }
  .piece-card img { width: 100%; height: 72px; object-fit: cover; border-radius: 4px; background: #333; }
  .piece-card .nm { display: block; font-size: 13px; margin-top: 6px; color: #eee;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .piece-card small { color: #888; }

  /* プレイヤー画面 */
  header { padding: 10px 16px; background: var(--bark); color: #eee; position: sticky; top: 0; z-index: 10;
           display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header label { font-size: 13px; }
  input[type=number] { width: 66px; }
  #status { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }
  main { display: flex; gap: 16px; align-items: flex-start; padding: 16px; background: transparent; justify-content: center; }
  /* 調節モード: 楽譜を中央寄せ + 背景オレンジ(調整中だと分かるように) */
  body.review-mode main { justify-content: center; background: var(--review-bg); }
  body.review-mode #player { display: none; }
  body.review-mode #views { flex: 0 1 auto; max-width: 1000px; width: 100%; }
  body.review-mode #score-wrap { max-width: 100%; }
  #score-wrap { position: relative; flex: 1; max-width: 70%; -webkit-user-select: none; user-select: none; }
  #score-wrap, #score, svg { -webkit-user-select: none; user-select: none; }
  #score { width: 100%; display: block; }
  /* NOTE: #ov 限定。汎用 svg/polygon にすると metro/bear の図形にも適用され、
     菱形がビューポート基準で絶対配置+オレンジ太線化して画面が崩れる */
  #ov { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #ov polygon { fill: transparent; stroke: rgba(80,109,47,.75); stroke-width: 6; cursor: pointer; }
  #ov polygon.inloop { fill: rgba(60,160,255,.16); }  /* ループ範囲 */
  #ov polygon.cue { stroke: #39d353; stroke-width: 9; }  /* 頭出しで選んだ開始小節 */
  #ov polygon.lowconf { stroke: #d500f9; stroke-width: 8; stroke-dasharray: 10 6; }  /* AIが自信なし=要確認 */
  #ov polygon.active { fill: rgba(255,60,60,.30); stroke: #ff2d2d; stroke-width: 9; }
  #ov polygon.sel { stroke: none; }  /* 選択小節はスポットライトで分かるので枠線なし=見やすく */
  #player { display: none; }
  #views { width: 100%; max-width: 900px; }
  #metro-view, #bear-view { text-align: center; padding-top: 10px; }
  /* SVGに明示的な高さを与える(未指定だと150pxになり図形がはみ出てtransportに重なる)。
     preserveAspectRatio(meet)で図形はボックス内に収まるので下の要素と重ならない */
  #metro-svg, #bear-svg { width: 420px; max-width: 92%; display: block; margin: 0 auto; }
  #metro-svg { height: 340px; }
  /* しきくまの背景はアプリのテーマ(body)を使う。svgは透明にして「島」をなくす */
  #bear-svg { height: 380px; background: transparent; }
  /* 楽譜ミニストリップ(metro/bear ビューで現在の段をハイライト表示) */
  #score-mini { padding: 0 8px 8px; }
  #score-strip { width: 100%; display: block; border-radius: 6px; }
  #strip-label { text-align: center; font-size: 14px; color: #666; min-height: 18px; margin-bottom: 3px; }
  /* ハンバーガーメニュー */
  #menu-btn { font-size: 20px; padding: 6px 11px; line-height: 1; background: var(--brown); color: #fff; }
  #settings-btn { font-size: 24px; padding: 5px 13px; line-height: 1; margin-left: auto; }
  #play-ctrls { flex: 1; }  /* 設定(⚙)を画面右端へ寄せるため幅いっぱいに */
  #ham-menu { position: fixed; top: 56px; left: 0; z-index: 50; background: var(--bark);
              border: 1px solid #444; border-radius: 0 0 12px 0; padding: 10px;
              display: flex; flex-direction: column; gap: 8px; min-width: 180px;
              box-shadow: 4px 4px 16px #0006; }
  /* モバイル */
  @media (max-width: 700px) {
    main { padding: 8px; }
    #views { max-width: 100%; }
    /* ヘッダーを1段に: タイトル文字を隠し ☰ [モード▼] [⚙] だけにする(調節の<strong>は残す) */
    header > strong { display: none; }
    /* 譜読みモードの楽譜はスマホでは横幅いっぱい(見やすさ優先) */
    #score-wrap { max-width: 100%; }
    /* 図形は端末幅で一度決まる固定サイズ。演奏中に大きさ・位置が変わらないようにする
       (flexで伸縮させると小節や transport の変化でサイズが動き、集中を妨げるため) */
    #metro-svg, #bear-svg { width: min(88vw, 360px); height: auto; }
    /* ミニ楽譜は高さ固定。小節ごとに段の高さが変わっても下の図形・ボタンの位置がずれない */
    #score-mini { height: 124px; overflow: hidden; }
  }
  /* 縦が狭い端末では transport を1行に(♩=136 と ▶⟲ を横並び)して高さを節約 */
  @media (max-width: 700px) and (max-height: 720px) {
    #transport { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 6px; }
    #transport .tbtns { margin-top: 0; }
  }
  /* 設定ポップアップ */
  .spopup { position: fixed; inset: 0; z-index: 40; background: #0003; display: flex;
            align-items: flex-start; justify-content: flex-end; padding: 60px 16px 0; }
  .sp-card { background: #f5f3f0; border-radius: 14px; padding: 18px; min-width: 240px;
             box-shadow: 0 8px 30px #0005; display: flex; flex-direction: column; gap: 14px; }
  .sp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .sp-head strong { font-size: 16px; color: #333; }
  .sp-row { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #222; }
  .sp-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  /* 再生モードのモード選択 */
  #view { font-size: 15px; padding: 7px 12px; border-radius: 8px; border: 1.5px solid #666;
          background: #2a2a2a; color: #eee; cursor: pointer; }
  #editor { position: fixed; bottom: 16px; left: 16px; z-index: 20; background: var(--bark); color: #eee;
            border: 1px solid var(--accent-light); border-radius: 10px; padding: 14px 16px; display: flex;
            flex-direction: column; gap: 10px; min-width: 260px; box-shadow: 0 6px 24px #000a; }
  #editor h3 { margin: 0; font-size: 15px; color: var(--accent-light); cursor: move; user-select: none; }
  #editor label { font-size: 13px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  #editor input { width: 120px; }
  #editor .row { display: flex; gap: 8px; }

  /* 開始情報の確認ポップアップ(自律: くまが聞く) */
  .sp2-card { background: #fff; border-radius: 18px; padding: 22px; width: 320px; max-width: 90vw;
              box-shadow: 0 10px 40px #0005; display: flex; flex-direction: column; gap: 14px; }
  .sp2-head { font-size: 19px; font-weight: bold; color: var(--accent); text-align: center; }
  .sp2-note { font-size: 13px; color: #555; margin: 0; line-height: 1.6; text-align: center; }
  .sp2-field { font-size: 14px; color: #222; display: flex; flex-direction: column; gap: 6px; }
  .sp2-field > span { display: flex; align-items: center; gap: 8px; }
  .sp2-field input[type=number] { width: 60px; padding: 6px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
  .sp2-field select { padding: 6px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }

  /* 調節(レビュー)モード */
  .ctrls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .seg { display: flex; gap: 0; }
  .seg .tool { border-radius: 0; }
  .seg .tool:first-child { border-radius: 8px 0 0 8px; }
  .seg .tool:last-child { border-radius: 0 8px 8px 0; }
  .tool.active { background: var(--accent); color: #fff; font-weight: 700; }
  #ov polygon.mergesel { fill: rgba(60,160,255,.28); stroke: #3ca0ff; stroke-width: 9; }
  #rlabels text { paint-order: stroke; }

  /* 再生トランスポート(大きな操作ボタン) */
  #transport { text-align: center; margin: 14px auto 4px; }
  #transport .tempo-line { font-size: 30px; font-weight: bold; cursor: pointer; display: inline-block;
                           padding: 2px 10px; border-radius: 8px; }
  #transport .tempo-line:hover { background: var(--review-bg); }
  #transport .tempo-line #big-bpm { color: var(--accent); }
  #transport .tempo-line .pre-note { font-size: 15px; font-weight: 500; color: #888; margin-left: 10px; }
  #transport .tbtns { display: flex; gap: 20px; justify-content: center; align-items: center; margin-top: 10px; }
  .round { width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer;
           font-size: 30px; line-height: 1; color: #fff; background: var(--accent); box-shadow: 0 3px 10px #0002; }
  .round:active { transform: translateY(1px); }
  .round.playing { background: var(--accent-dark); }
  .round.small { width: 56px; height: 56px; font-size: 24px; background: #fff; color: var(--accent);
                 border: 3px solid var(--accent); box-shadow: none; }

  /* テンポ設定(テンキーポップアップ) */
  .modal { position: fixed; inset: 0; z-index: 40; background: #0006; display: flex;
           align-items: center; justify-content: center; }
  .kp-card { background: #e9e6ea; border-radius: 18px; padding: 18px; width: 300px;
             box-shadow: 0 10px 40px #0005; }
  .kp-head { display: flex; align-items: center; justify-content: center; position: relative; margin: 4px 0 14px; }
  #kp-val { font-size: 54px; font-weight: bold; color: #333; font-variant-numeric: tabular-nums; }
  .kp-close { position: absolute; right: 2px; top: 0; background: none; border: none; font-size: 30px;
              color: #777; cursor: pointer; line-height: 1; }
  .kp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; justify-items: center; }
  .kp-grid button { width: 64px; height: 64px; border-radius: 50%; border: none; background: #fff;
                    font-size: 24px; color: #333; cursor: pointer; box-shadow: 0 2px 5px #0001; }
  .kp-grid button:active { background: #f0e6d8; }
  .kp-ok { width: 100%; margin-top: 16px; padding: 14px; font-size: 20px;
           background: linear-gradient(90deg, var(--accent-light), var(--accent)); }
</style>
</head>
<body>

<!-- アップロード画面 -->
<section id="upload">
  <h1>指揮者っくま</h1>
  <p class="sub">楽譜の写真を読み込むと、変拍子でも指揮(メトロノーム)してくれる練習アプリ</p>
  <div class="card">
    <input id="file" type="file" accept="image/*">
    <button id="analyze" class="btn">この写真を解析する</button>
    <button id="sample" class="btn sub">サンプル(DANCE MOVEMENTS)で試す</button>
    <div id="up-status"></div>
  </div>
  <div id="library"></div>
</section>

<!-- プレイヤー画面 -->
<div id="app" class="hidden">
<header>
  <button id="menu-btn" class="btn sub" title="メニュー">☰</button>
  <strong>指揮者っくま</strong>
  <!-- JS参照用(非表示) -->
  <button id="back" class="hidden"></button>

  <!-- 調節(レビュー)モードのツールバー -->
  <div id="review-ctrls" class="ctrls">
    <strong>調節</strong>
    <div class="seg">
      <button id="tool-edit" class="btn sub tool active">拍子</button>
      <button id="tool-split" class="btn sub tool">分割</button>
      <button id="tool-merge" class="btn sub tool">結合</button>
    </div>
    <button id="undo" class="btn sub" disabled>戻す</button>
    <span id="tool-hint" style="color:var(--accent);font-size:12px"></span>
    <span style="color:#888;font-size:11px"><span style="color:#d500f9">紫破線</span>=AI自信なし(要確認)</span>
    <button id="rename" class="btn sub">名前</button>
    <button id="to-play" class="btn">▶ この内容で練習する</button>
  </div>

  <!-- 再生モードのツールバー -->
  <div id="play-ctrls" class="ctrls hidden">
    <select id="view">
      <option value="score">譜読み</option>
      <option value="metro">メトロノーム</option>
      <option value="bear">しきくま</option>
    </select>
    <button id="settings-btn" class="btn sub" title="設定">⚙</button>
    <!-- JS参照用(UI非表示) -->
    <button id="play" class="hidden"></button>
    <button id="restart" class="hidden"></button>
    <button id="to-review" class="hidden"></button>
    <input id="tempo" type="number" class="hidden" value="136" min="20">
    <input id="start" type="number" class="hidden" value="0">
    <select id="mode" class="hidden"><option value="metro">楽譜のテンポ</option></select>
    <select id="src" class="hidden"><option value="solo">単体</option></select>
    <span id="status" class="hidden">—</span>
  </div>
</header>

<!-- ハンバーガーメニュー -->
<div id="ham-menu" class="ham-menu hidden">
  <button id="ham-review" class="btn sub">← 調節に戻る</button>
  <button id="ham-back" class="btn sub">← 別の写真</button>
</div>
<main>
  <div id="views">
    <div id="score-wrap">
      <img id="score" alt="楽譜">
      <svg id="ov" preserveAspectRatio="none"></svg>
    </div>
    <div id="score-mini" class="hidden">
      <div id="strip-label"></div>
      <canvas id="score-strip"></canvas>
    </div>
    <div id="metro-view" class="hidden">
      <svg id="metro-svg" viewBox="0 0 420 380"></svg>
    </div>
    <div id="bear-view" class="hidden">
      <svg id="bear-svg" viewBox="0 0 420 420"></svg>
    </div>
    <div id="transport" class="hidden">
      <div class="tempo-line" id="tempo-line" title="クリックでテンポ設定">♩= <span id="big-bpm">136</span><span class="pre-note">前振り <span id="big-preN">4</span>拍</span></div>
      <div class="tbtns">
        <button id="big-play" class="round" title="再生 / 一時停止">▶</button>
        <button id="big-restart" class="round small" title="最初から">⟲</button>
      </div>
    </div>
  </div>
  <div id="player"></div>
</main>

<!-- 開始情報の確認(自律: 読み取りにくい時だけ くまが聞く) -->
<div id="startpopup" class="modal hidden">
  <div class="sp2-card">
    <div class="sp2-head">正しく振るために確認させて！</div>
    <p class="sp2-note" id="sp2-note">このページの冒頭、拍子が読み取りにくいところがありました。<br>開始の<b>拍子</b>と<b>テンポ</b>を教えてください。</p>
    <label class="sp2-field" id="st-ts-row">開始の拍子
      <span><input id="st-num" type="number" min="1" value="4"> <b>/</b> <input id="st-den" type="number" min="1" value="4"></span>
    </label>
    <label class="sp2-field" id="st-tempo-row">テンポ
      <span>
        <select id="st-unit">
          <option value="1">♩ = 4分</option>
          <option value="2">2分音符</option>
          <option value="0.5">♪ = 8分</option>
          <option value="1.5">♩. = 付点4分</option>
        </select>
        = <input id="st-bpm" type="number" min="20" value="136">
      </span>
    </label>
    <button id="st-ok" class="btn kp-ok">この内容で振る</button>
  </div>
</div>

<!-- テンポ設定(テンキー) -->
<div id="keypad" class="modal hidden">
  <div class="kp-card">
    <div class="kp-head"><span id="kp-val">136</span><button id="kp-x" class="kp-close" title="閉じる">×</button></div>
    <div class="kp-grid">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <span></span><button data-k="0">0</button><button data-k="CL">CL</button>
    </div>
    <button id="kp-ok" class="btn kp-ok">OK</button>
  </div>
</div>

<!-- 設定ポップアップ -->
<div id="settings-popup" class="spopup hidden">
  <div class="sp-card">
    <div class="sp-head">
      <strong>設定</strong>
      <button id="settings-close" class="kp-close" title="閉じる">×</button>
    </div>
    <label class="sp-row"><input id="snd" type="checkbox"> メトロノーム音</label>
    <label class="sp-row"><input id="pre" type="checkbox" checked> 前拍あり <input id="preN" type="number" value="4" readonly style="width:36px;border:none;background:transparent;color:#888">拍</label>
    <!-- <label class="sp-row"><input id="theme-toggle" type="checkbox"> ダークモード</label> -->
    <label class="sp-row"><input id="loop" type="checkbox"> ループ</label>
    <div class="sp-row" id="loop-range-row">
      <span style="color:#888;font-size:13px">小節</span>
      <input id="loopA" type="number" min="1" value="1" style="width:48px">
      <span style="color:#888">〜</span>
      <input id="loopB" type="number" min="1" value="4" style="width:48px">
    </div>
  </div>
</div>

<div id="editor" class="hidden">
  <h3 id="e-title">小節を補正</h3>
  <label>拍子 <input id="e-ts" type="text" placeholder="4/4, 5/8 …"></label>
  <label>分け方 <input id="e-bg" type="text"></label>
  <div style="font-size:11px;color:#999;max-width:230px">分け方 = 拍の区切り(数字の列)。4/4→1,1,1,1 / 5/8を2+3→2,3</div>
  <div class="row">
    <button id="e-apply" class="btn">この小節に反映</button>
    <button id="e-close" class="btn sub">閉じる</button>
  </div>
</div>
</div>

<script>
let overlay, beats, meter, measureStarts = [], player, current = -1, tickStarted = false;
let currentJob = null;   // いま見ているページのジョブID
let currentPiece = null, currentPieceName = '';  // いま開いている曲(名前付き保存)
let actx, clicks = [], nextClick = 0, lastT = 0;
let playing = false, playStart = 0, baseT = 0, selected = -1;
let loopAnchor = null, clickTimer = null;  // ループ範囲をクリックで指定するため
let playFrom = 0, preClicks = [], nextPre = 0;  // 前拍: playFrom から本編、その手前は前拍(小節は光らせない)
let cueIndex = 0;  // 頭出しで選んだ開始小節(通し番号)
let metroV = [], metroSig = '';  // メトロノーム図形の頂点と形のキー
let appMode = 'review', reviewTool = 'edit', mergeSel = -1, currentImage = '';  // 調節/再生の切替
let undoStack = [];  // 調節の1手戻す用(分割・結合・拍子編集の直前スナップショット)
let pausedAt = null, kpBuf = '', lastUI = '';  // 一時停止位置 / テンキー入力 / 再生UIの前回状態
let lastStripKey = '';  // updateScoreMini の変化検知キー
let startConfirmed = false;  // 開始の拍子・テンポをユーザーに確認済みか(自律: 低信頼なら聞く)
let theme = localStorage.getItem('kuma_theme') || 'marble';  // アプリ背景テーマ(marble=明 / leaves=森)

function now() { return performance.now() / 1000; }
const $ = id => document.getElementById(id);

// 拍子 → 4分音符換算の拍数(例 "5/8"→2.5, "4/4+2/4"→6)
function beatsOf(ts) {
  let t = 0;
  ts.split('+').forEach(p => { const [n, d] = p.split('/').map(Number); if (n && d) t += n * 4 / d; });
  return t || 4;
}

// 今その小節で実際に使われている「分け方」(数字の列)。空=自動をやめ、常に実値を見せる
function effectiveGroups(info) {
  if (info.beat_groups && info.beat_groups.length) return info.beat_groups;
  const g = [];
  info.ts.split('+').forEach(part => {
    const num = parseInt(part.split('/')[0]);
    for (let k = 0; k < num; k++) g.push(1);
  });
  return g.length ? g : [1];
}

// 各小節の上に今の判定(拍子 + 不規則なら分け方)を描く。判定表示モードで見せる
function updateLabels() {
  const g = $('labels');
  if (!g) return;
  g.innerHTML = overlay.measures.map(m => {
    const info = meter.measures.find(x => x.index === m.index);
    if (!info) return '';
    const txt = info.ts + (info.beat_groups && info.beat_groups.length ? ' ' + info.beat_groups.join('+') : '');
    const [x, y] = m.points[0];
    return `<text x="${x + 6}" y="${y + 48}" font-size="46" font-weight="bold" fill="#00e5ff" ` +
           `stroke="#000" stroke-width="3" paint-order="stroke">${txt}</text>`;
  }).join('');
}

// 小節をダブルクリック → 編集パネル + その小節以外を暗く(スポットライト)
function openEditor(i) {
  selected = i;
  const info = meter.measures.find(x => x.index === i) || { ts: '4/4', beat_groups: [] };
  const conf = info.confidence !== undefined ? `  (AI信頼度 ${Math.round(info.confidence * 100)}%${info.confidence < 1 ? ' ⚠' : ''})` : '';
  $('e-title').textContent = `小節 ${i + 1} を補正${conf}`;
  $('e-ts').value = info.ts;
  $('e-bg').value = effectiveGroups(info).join(',');
  const ed = $('editor');
  ed.classList.remove('hidden');
  document.querySelectorAll('polygon[data-i]').forEach(p => p.classList.toggle('sel', +p.dataset.i === i));
  const m = overlay.measures.find(x => x.index === i);
  const pts = m.points.map(p => p.join(',')).join(' ');
  // 大きい四角 − 選択小節 を evenodd でくり抜く = その小節以外だけ暗くなる。+ 白ハイライトで明るく
  const hole = 'M ' + m.points.map(p => p.join(' ')).join(' L ') + ' Z';
  const dpath = `M0 0 H${overlay.width} V${overlay.height} H0 Z ${hole}`;
  $('spotlight').innerHTML =
    `<path d="${dpath}" fill="#353535" opacity="0.82" fill-rule="evenodd" pointer-events="none"/>` +
    `<polygon points="${pts}" fill="#fff" opacity="0.18" pointer-events="none"/>`;

  // ポップアップをタップした小節の近く(基本は下、入らなければ上)に出す
  const r = $('ov').querySelector(`polygon[data-i="${i}"]`).getBoundingClientRect();
  const eh = ed.offsetHeight, ew = ed.offsetWidth;
  let top = r.bottom + 28;  // 小節の少し下に
  if (top + eh > window.innerHeight - 8) top = Math.max(8, r.top - eh - 12);
  const left = Math.max(8, Math.min(r.left, window.innerWidth - ew - 8));
  ed.style.left = left + 'px';
  ed.style.top = top + 'px';
  ed.style.right = 'auto';
  ed.style.bottom = 'auto';
}

// ---- 画面遷移 ----
// 現在の状態(曲/ジョブ + 再生ビュー)を URL に反映。リロードで同じ画面・モードに復元できる
function updateURL() {
  const p = new URLSearchParams();
  if (currentPiece) p.set('piece', currentPiece);
  else if (currentJob) p.set('job', currentJob);
  if (appMode === 'play') p.set('view', $('view').value);
  const q = p.toString();
  history.replaceState(null, '', q ? '?' + q : location.pathname);
}

// mode: 'play' なら最初から再生画面へ(保存済みジョブ/曲の復元)。省略時は調節画面(新規解析)
function initFromData(image, ov, mt, bt, mode) {
  overlay = ov; meter = mt; currentImage = image; undoStack = []; lastStripKey = '';
  // 確認要否は mode でなく信頼度で決める(保存済み=補正で confidence=1 → 聞かない / 未保存の低信頼 → 聞く)
  startConfirmed = false;
  // サンプル(ジョブ無し)は localStorage に保存した補正(拍子+枠)があれば復元
  if (!currentJob) {
    const saved = localStorage.getItem('kuma_save_' + image);
    if (saved) { try { const s = JSON.parse(saved); if (s.meter) meter = s.meter; if (s.overlay) overlay = s.overlay; } catch (e) {} }
  }
  beats = bt && bt.beat_times && bt.beat_times.length ? bt : { tempo: 136, beat_times: [] };
  $('score').src = image;
  $('upload').classList.add('hidden');
  $('app').classList.remove('hidden');
  if (!tickStarted) { tick(); tickStarted = true; }
  // 新規解析は調節画面、保存済み(リロード復元)は確認済みとして再生画面へ
  if (mode === 'play') { enterReview(); enterPlay(); }
  else enterReview();
}

// index から拍子情報を引く(無ければ既定)
function meterFor(i) {
  return meter.measures.find(x => x.index === i) || { ts: '4/4', beats: 4, beat_groups: [] };
}

// overlay 多角形 + ラベル + クリック操作を #ov に描き直す(分割・結合後にも呼ぶ)
function renderPolys() {
  const svg = $('ov');
  svg.setAttribute('viewBox', `0 0 ${overlay.width} ${overlay.height}`);
  const polys = overlay.measures.map(m => {
    const info = meterFor(m.index);
    const low = info.confidence !== undefined && info.confidence < 1.0;
    return `<polygon data-i="${m.index}" class="${low ? 'lowconf' : ''}" points="${m.points.map(p => p.join(',')).join(' ')}"/>`;
  }).join('');
  svg.innerHTML = polys
    + `<g id="labels" style="display:none"></g>`       // 再生側の判定表示(🏷トグル)
    + `<g id="rlabels" class="${appMode === 'review' ? '' : 'hidden'}"></g>`  // 調節側の拍子ラベル(常時)
    + `<g id="spotlight"></g>`;
  svg.querySelectorAll('polygon[data-i]').forEach(p => {
    p.onclick = (e) => onPoly(+p.dataset.i, p, e);
  });
  updateLabels();
  renderReviewLabels();
  updateLoopHighlight();
}

// 調節画面の拍子ラベル(各小節の上に大きく)
function renderReviewLabels() {
  const g = $('rlabels');
  if (!g) return;
  g.innerHTML = overlay.measures.map(m => {
    const info = meterFor(m.index);
    const [p0, p1] = [m.points[0], m.points[1]];
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    const bg = info.beat_groups && info.beat_groups.length ? ` (${info.beat_groups.join('+')})` : '';
    return `<text x="${mx}" y="${my - 16}" text-anchor="middle" font-size="60" font-weight="bold" ` +
           `fill="#111" stroke="#fff" stroke-width="7">${info.ts}${bg}</text>`;
  }).join('');
}

function refreshLabels() { updateLabels(); renderReviewLabels(); }

// 小節クリックの振り分け(調節=編集/分割/結合、再生=頭出し/ループ範囲)
function onPoly(i, p, e) {
  if (appMode === 'review') {
    e.stopPropagation();  // score-wrap の「クリックで閉じる」に拾わせない
    if (reviewTool === 'edit') openEditor(i);
    else if (reviewTool === 'split') doSplit(i, e);
    else if (reviewTool === 'merge') doMerge(i);
  } else {
    if ($('loop').checked) setLoopPoint(i);
    else { setCue(i); if (isPlaying()) playFromOrdinal(cueIndex); }
  }
}

// ---- 1手戻す(Undo) ----
// 分割・結合・拍子編集の直前に overlay/meter のスナップショットを積む
function pushUndo() {
  undoStack.push({ ov: JSON.parse(JSON.stringify(overlay)), mt: JSON.parse(JSON.stringify(meter)) });
  if (undoStack.length > 50) undoStack.shift();
  updateUndoBtn();
}
function undo() {
  if (!undoStack.length) { $('tool-hint').textContent = '戻せる操作がありません'; return; }
  const s = undoStack.pop();
  overlay = s.ov; meter = s.mt; mergeSel = -1;
  if (!$('editor').classList.contains('hidden')) $('e-close').onclick();
  renderPolys();
  updateUndoBtn();
  $('tool-hint').textContent = '1つ戻しました';
  persist();
}
function updateUndoBtn() { const b = $('undo'); if (b) b.disabled = undoStack.length === 0; }

// ---- 分割・結合(フロントの多角形幾何で完結。index を再採番して overlay/meter を同期) ----
// 現状を「枠(幾何)+拍子」をまとめた配列にする
function cellsFromState() {
  return overlay.measures.map(m => {
    const mi = meterFor(m.index);
    return {
      staff: m.staff, points: m.points.map(pt => pt.slice()),
      ts: mi.ts, beats: mi.beats, beat_groups: (mi.beat_groups || []).slice(), confidence: mi.confidence,
    };
  });
}
// 配列から overlay/meter を作り直して再描画(index = 並び順)
function rebuild(cells) {
  overlay.measures = cells.map((c, i) => ({ index: i, staff: c.staff, points: c.points }));
  meter.measures = cells.map((c, i) => {
    const o = { index: i, ts: c.ts, beats: c.beats, beat_groups: c.beat_groups };
    if (c.confidence !== undefined) o.confidence = c.confidence;
    return o;
  });
  mergeSel = -1;
  renderPolys();
  persist();
}
// 画面座標 → #ov の viewBox 座標の x
function svgX(e) {
  const svg = $('ov'), pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse()).x;
}
// クリックした x 位置で小節を2つに切る(上辺・下辺を同じ比で内分)
// 拍子の割り当て: "4/4+2/4" のような複合枠(= 小節線の見落としで1枠に2小節)は
//   左=先頭の拍子, 右=残りの拍子 に分け、beats も拍子から再計算する。
//   単独拍子(+なし)の枠は推定不能なので両方に同じ拍子を複製し、人が直す前提。
function doSplit(i, e) {
  pushUndo();
  const k = overlay.measures.findIndex(m => m.index === i);
  const cells = cellsFromState();
  const c = cells[k];
  const [p0, p1, p2, p3] = c.points;  // TL, TR, BR, BL
  let f = (svgX(e) - p0[0]) / ((p1[0] - p0[0]) || 1);
  f = Math.max(0.12, Math.min(0.88, f));
  const lerp = (a, b) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  const cTop = lerp(p0, p1), cBot = lerp(p3, p2);
  const parts = c.ts.split('+');
  const compound = parts.length > 1;              // 複合枠(見落とし)か
  const lts = parts[0];                           // 左 = 先頭の拍子
  const rts = compound ? parts.slice(1).join('+') : c.ts;  // 右 = 残り(単独枠は複製)
  const bg = compound ? [] : c.beat_groups.slice();        // 分け方: 複合枠を割ったら各部は単独→クリア
  const left  = { staff: c.staff, points: [p0, cTop, cBot, p3], ts: lts, beats: beatsOf(lts), beat_groups: bg.slice(), confidence: 1 };
  const right = { staff: c.staff, points: [cTop, p1, p2, cBot], ts: rts, beats: beatsOf(rts), beat_groups: bg.slice(), confidence: 1 };
  cells.splice(k, 1, left, right);
  rebuild(cells);
}
// 隣り合う2小節(同じ段)を順にクリック → 1小節に結合
function doMerge(i) {
  if (mergeSel < 0 || i === mergeSel) { mergeSel = (i === mergeSel) ? -1 : i; markMergeSel(); return; }
  const k0 = overlay.measures.findIndex(m => m.index === mergeSel);
  const k = overlay.measures.findIndex(m => m.index === i);
  if (Math.abs(k - k0) !== 1 || overlay.measures[k].staff !== overlay.measures[k0].staff) {
    mergeSel = i; markMergeSel(); return;  // 隣接・同段でなければ選び直し
  }
  pushUndo();
  const a = Math.min(k, k0), b = Math.max(k, k0);
  const cells = cellsFromState();
  const L = cells[a], R = cells[b];
  const merged = { ...L, points: [L.points[0], R.points[1], R.points[2], L.points[3]], confidence: 1 };
  cells.splice(a, 2, merged);  // 左の拍子を残す
  rebuild(cells);
}
function markMergeSel() {
  document.querySelectorAll('polygon[data-i]').forEach(p => p.classList.toggle('mergesel', +p.dataset.i === mergeSel));
}

// ---- 自律: 開始情報(拍子・テンポ)の確認 ----
// triage(read_start.py)が「読めなかった」と言った項目だけを、くまが人に聞く(human-in-the-loop)
let startInfo = null;   // 直近の start.json(サーバの triage 結果)
let startResolve = null;

// 保険の判定。解析前に triage を通らなかった経路(保存済みの復元・サンプル)で使う
function needStartConfirm() {
  const m0 = meter.measures[0];
  if (!m0) return false;
  // NOTE: ts_source が無い=旧フォーマットの保存データ。新条件(tempo anchor が要る等)を当てると
  //   既存の保存曲すべてでポップアップが出てしまうので、従来の confidence 条件のままにする
  if (m0.ts_source === undefined) return m0.confidence !== undefined && m0.confidence < 1;
  // 1小節目が「前から引き継いだ」「手がかり無し」= この写真から開始の拍子が読めていない。
  //   2小節目以降の carried は正常(拍子は変わるときだけ印刷される)ので判定には使わない
  return ['carried', 'unknown'].includes(m0.ts_source) || !(m0.tempo > 0);
}

// NOTE: 推測を言わない。「2枚目だね」のような当て推量はしない(1枚目でも3枚目でも、
//   最初の小節に記載が無いことはある)。言うのは「どこが」「何が」わからないかだけ。
function startAskText(start, ask) {
  const n = start && start.first_measure_number;
  const where = (!n || n === 1) ? '始めの' : `${n}小節目の`;
  const what = ask.includes('ts') && ask.includes('tempo') ? '拍子とテンポ'
    : ask.includes('ts') ? '拍子' : 'テンポ';
  const zoomed = !!(start && (start.attempts || []).some(a => a.pass === 'zoom'));
  return (zoomed ? '大きくして見てみたけど、わからなかったっくま。<br>' : '')
    + `<b>${where}${what}</b>がわからないっくま。教えて！`;
}

// 読めなかった項目だけ表示して聞く。答え({ts, tempo, unit, tempo_text})で解決する Promise を返す
function askStart(start) {
  const ask = (start && start.ask && start.ask.length) ? start.ask : ['ts', 'tempo'];
  $('st-ts-row').classList.toggle('hidden', !ask.includes('ts'));
  $('st-tempo-row').classList.toggle('hidden', !ask.includes('tempo'));
  $('sp2-note').innerHTML = startAskText(start, ask);
  // AIが読めていた値は事前入力しておく(読めた項目は聞かないので、ここは主に既定値)
  // NOTE: 解析前(アップロード直後)に聞く経路では meter がまだ無い。meter に触る前に必ず確かめる
  const m0 = (meter && meter.measures && meter.measures[0]) || {};
  const ts = (start && start.ts && start.ts.value) || m0.ts || '4/4';
  const [n, d] = String(ts).split('+')[0].split('/');
  $('st-num').value = parseInt(n) || 4;
  $('st-den').value = parseInt(d) || 4;
  $('st-unit').value = '1';
  $('st-bpm').value = $('tempo').value;
  $('startpopup').classList.remove('hidden');
  return new Promise(res => { startResolve = res; });
}
// 確定した開始の拍子を、先頭から続く「同じ拍子だった小節(=誤って引き継がれた分)」に伝播
function recascadeStart(ts, beats) {
  const oldTs = meter.measures[0] ? meter.measures[0].ts : null;
  for (let i = 0; i < meter.measures.length; i++) {
    if (i === 0 || meter.measures[i].ts === oldTs) {
      meter.measures[i].ts = ts;
      meter.measures[i].beats = beats;
      meter.measures[i].beat_groups = [];
      meter.measures[i].confidence = 1;
    } else break;  // 別の拍子が現れたら伝播を止める
  }
}
const UNIT_NAME = { '1': 'quarter', '2': 'half', '0.5': 'eighth', '1.5': 'dotted_quarter' };
$('st-ok').onclick = () => {
  const n = parseInt($('st-num').value) || 4, d = parseInt($('st-den').value) || 4;
  const u = $('st-unit').value;
  const unit = parseFloat(u) || 1;  // 4分換算係数(2分=2, 8分=0.5, 付点4分=1.5)
  const raw = Math.max(20, parseFloat($('st-bpm').value) || 136);
  const ask = (startInfo && startInfo.ask && startInfo.ask.length) ? startInfo.ask : ['ts', 'tempo'];
  const answer = {};
  if (ask.includes('ts')) answer.ts = n + '/' + d;
  if (ask.includes('tempo')) {
    answer.tempo = Math.round(raw * unit);   // サーバ・meter は4分換算で持つ
    answer.unit = UNIT_NAME[u] || 'quarter';
    answer.tempo_text = $('st-unit').selectedOptions[0].textContent.trim() + ' = ' + raw;
  }
  startConfirmed = true;
  $('startpopup').classList.add('hidden');
  if (startResolve) { const r = startResolve; startResolve = null; r(answer); }
};

// 人の答えを手元の meter に反映する(保険の経路。解析前に聞けた場合はサーバ側で反映済み)
function applyStartAnswer(answer) {
  if (answer.tempo) { $('tempo').value = answer.tempo; $('big-bpm').textContent = answer.tempo; }
  if (answer.ts) recascadeStart(answer.ts, beatsOf(answer.ts));
  const m0 = meter.measures[0];
  if (m0 && answer.tempo) { m0.tempo = answer.tempo; m0.tempo_source = 'user'; }
  if (m0 && answer.ts) m0.ts_source = 'user';
  renderPolys();  // 低信頼(紫破線)の解除をラベルに反映
  persist();      // 開始情報の確定も自動保存
}

// ---- モード切替(調節 / 再生) ----
function enterReview() {
  appMode = 'review';
  document.body.classList.add('review-mode');  // 楽譜中央寄せ + 背景オレンジ
  playing = false; if ($('play')) $('play').textContent = '▶再生';
  $('review-ctrls').classList.remove('hidden');
  $('play-ctrls').classList.add('hidden');
  switchView('score');  // 調節中は楽譜を表示(view値は再生に入ったとき復元するため変えない)
  renderPolys();
  setReviewTool('edit');
  updateUndoBtn();
  updateURL();
}
function enterPlay() {
  if (!$('editor').classList.contains('hidden')) $('e-close').onclick();
  // 保険: 解析前に聞けなかった経路(保存済みの復元・サンプル)で開始情報が不明なら、振る前に聞く
  if (!startConfirmed && needStartConfirm()) {
    askStart(startInfo).then(a => { applyStartAnswer(a); enterPlay(); });
    return;
  }
  appMode = 'play';
  document.body.classList.remove('review-mode');
  $('review-ctrls').classList.add('hidden');
  $('play-ctrls').classList.remove('hidden');
  if ($('rlabels')) $('rlabels').classList.add('hidden');
  cueIndex = 0;
  $('preN').value = pulsesAt(0).length;
  $('big-bpm').textContent = $('tempo').value;
  computeTimeline(); current = -1;
  switchView($('view').value);
  updatePlayUI();
  updateURL();
}
function setReviewTool(t) {
  reviewTool = t; mergeSel = -1;
  if (!$('editor').classList.contains('hidden')) $('e-close').onclick();
  markMergeSel();
  ['edit', 'split', 'merge'].forEach(x => $('tool-' + x).classList.toggle('active', x === t));
  const hints = {
    edit: '小節をクリック → 拍子・分け方を直す',
    split: '小節線が抜けた所をクリック → そこで2つに分割',
    merge: '余分な線で割れた所: 隣り合う2小節を順にクリック → 結合',
  };
  $('tool-hint').textContent = hints[t];
  $('ov').style.cursor = t === 'split' ? 'col-resize' : 'pointer';
}

// ---- 拍のタイムライン ----
function computeTimeline() {
  const start = parseFloat($('start').value) || 0;
  const per = 4;  // meter に無い小節のフォールバック拍数
  const mode = $('mode').value;
  if (mode === 'metro') {
    const tempo = Math.max(20, parseFloat($('tempo').value) || 136);
    const spb = 60 / tempo;
    let acc = 0;
    measureStarts = overlay.measures.map((m) => {
      const t = start + acc * spb;
      const info = meter.measures.find(x => x.index === m.index);
      acc += info ? info.beats : per;
      return t;
    });
  } else {
    const bt = beats.beat_times;
    let first = bt.findIndex(t => t >= start);
    if (first < 0) first = 0;
    measureStarts = overlay.measures.map((_, i) => {
      const idx = first + i * per;
      return idx < bt.length ? bt[idx] : null;
    });
  }
  buildClicks();
}

// ---- メトロノーム音(Web Audio) ----
// when(AudioContext時刻)を渡すと正確に予約。小節の頭は高い音でアクセント
function click(accent, when) {
  if (!actx) return;
  const t = when != null ? when : actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = accent ? 1600 : 1000;
  o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.001);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.start(t); o.stop(t + 0.06);
}

// 再生時刻 ct(単体クロック)→ AudioContext の時刻に変換(先読み予約用)
let audioStart = 0;
function audioTime(ct) { return audioStart + (ct - baseT); }

// 1小節を「拍(パルス)」の長さ(4分音符単位)の配列にする。
//   beat_groups 有り(例 5/8=[2,3]) → グループごと。8分系で無し → 8分ごと。4分系 → 4分ごと。
//   "4/4+2/4"(見落とし2小節) → 各拍子を順に連結
function measurePulses(info) {
  const pulses = [];
  const single = info.ts.indexOf('+') < 0;
  info.ts.split('+').forEach(part => {
    const [num, den] = part.split('/').map(Number);
    if (!num || !den) return;
    if (single && info.beat_groups && info.beat_groups.length) {
      info.beat_groups.forEach(g => pulses.push(g * 4 / den));  // グループ(分母音符の数)→4分換算
    } else {
      for (let k = 0; k < num; k++) pulses.push(4 / den);       // 分母音符ごと(4分系=1, 8分系=0.5)
    }
  });
  return pulses.length ? pulses : [1];
}

function buildClicks() {
  clicks = [];
  if ($('mode').value === 'metro') {
    const tempo = Math.max(20, parseFloat($('tempo').value) || 136);
    const spb = 60 / tempo;
    overlay.measures.forEach((m, i) => {
      const info = meter.measures.find(x => x.index === m.index);
      const pulses = info ? measurePulses(info) : [1, 1, 1, 1];
      let off = 0;
      pulses.forEach((dur, k) => {
        clicks.push({ t: measureStarts[i] + off * spb, accent: k === 0 });
        off += dur;
      });
    });
  } else {
    const starts = new Set(measureStarts.filter(x => x !== null));
    beats.beat_times.forEach(t => clicks.push({ t, accent: starts.has(t) }));
  }
  clicks.sort((a, b) => a.t - b.t);
  nextClick = 0;
}

// ---- 小節ハイライト + 再生ループ ----
// ループ範囲(小節の通し番号 0始まり)と、その開始/終了時刻
function loopBounds() {
  const n = overlay.measures.length;
  let a = (parseInt($('loopA').value) || 1) - 1;
  let b = (parseInt($('loopB').value) || n) - 1;
  a = Math.max(0, Math.min(a, n - 1));
  b = Math.max(a, Math.min(b, n - 1));
  return [a, b];
}
function loopRange() {
  const [a, b] = loopBounds();
  const start = measureStarts[a] ?? 0;
  let end;
  if (b + 1 < measureStarts.length && measureStarts[b + 1] != null) {
    end = measureStarts[b + 1];
  } else {
    const info = meter.measures.find(x => x.index === overlay.measures[b].index);
    const tempo = Math.max(20, parseFloat($('tempo').value) || 136);
    end = (measureStarts[b] ?? 0) + (info ? info.beats : 4) * (60 / tempo);
  }
  return [start, end];
}
// 指定時刻へジャンプ(単体=内部クロック / YouTube=シーク)
function jumpTo(time) {
  current = -1;
  playFrom = time; nextPre = preClicks.length;  // ループ戻りでは前拍なし・ハイライト抑制もなし
  if ($('src').value === 'solo') { baseT = time; playStart = now(); audioStart = actx ? actx.currentTime : 0; }
  else if (player && player.seekTo) player.seekTo(time, true);
  nextClick = clicks.findIndex(c => c.t >= time);
  if (nextClick < 0) nextClick = clicks.length;
  lastT = time;
}
// 小節クリックでループ範囲を決める。1回目=始点、2回目=終点(小さい方→大きい方)
function setLoopPoint(idx) {
  const k = overlay.measures.findIndex(m => m.index === idx) + 1;  // 1始まりの通し番号
  if (loopAnchor === null) {
    loopAnchor = k;
    $('loopA').value = k; $('loopB').value = k;
  } else {
    $('loopA').value = Math.min(loopAnchor, k);
    $('loopB').value = Math.max(loopAnchor, k);
    loopAnchor = null;
  }
  updateLoopHighlight();
}

function updateLoopHighlight() {
  const on = $('loop').checked;
  if (!on) loopAnchor = null;
  const [a, b] = loopBounds();
  document.querySelectorAll('polygon[data-i]').forEach(p => {
    const k = overlay.measures.findIndex(m => m.index === +p.dataset.i);
    p.classList.toggle('inloop', on && k >= a && k <= b);
  });
}

// 時刻t での拍フェーズ: どの小節k・何拍目j・その拍内の進み frac(0〜1)
function beatPhase(t) {
  let k = -1;
  for (let i = 0; i < measureStarts.length; i++) {
    if (measureStarts[i] != null && measureStarts[i] <= t) k = i;
    else if (measureStarts[i] != null) break;
  }
  if (k < 0) return null;
  const info = meter.measures.find(x => x.index === overlay.measures[k].index);
  const pulses = info ? measurePulses(info) : [1, 1, 1, 1];
  const spb = 60 / Math.max(20, parseFloat($('tempo').value) || 136);
  let off = measureStarts[k];
  for (let j = 0; j < pulses.length; j++) {
    const d = pulses[j] * spb;
    if (t < off + d) return { k, pulses, j, frac: (t - off) / d };
    off += d;
  }
  return { k, pulses, j: pulses.length - 1, frac: 1 };
}

// 1拍目を真ん中上に固定した正N角形(時計回り)。始点が常に同じ位置=見やすい
function ngon(N, cx, cy, r) {
  const p = [];
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / N;  // 上(頂点)から始める
    p.push([+(cx + r * Math.cos(a)).toFixed(1), +(cy + r * Math.sin(a)).toFixed(1)]);
  }
  return p;
}

// 星型ポリゴンの points 文字列(cx,cy中心, n個の尖り)
function star(cx, cy, outer, inner, n) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = -Math.PI / 2 + i * Math.PI / n;
    pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');
}

// メトロノーム図形(B案): 拍(グループ)を頂点に、8分を小さいドットで。星マーカーが拍で頂点へ
function updateMetro(phase) {
  const svg = $('metro-svg');
  const pulses = phase ? phase.pulses : [1, 1, 1, 1];
  const N = Math.max(1, pulses.length);
  const sig = pulses.join(',');
  if (sig !== metroSig) {
    metroSig = sig;
    const v = ngon(N, 210, 190, 130);
    metroV = v;
    let eighths = '';  // 8分の刻みを小さい星で
    for (let j = 0; j < N; j++) {
      const a = v[j], b = v[(j + 1) % N], E = Math.max(1, Math.round(pulses[j] * 2));
      for (let e = 1; e < E; e++) {
        const f = e / E;
        eighths += `<polygon points="${star(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, 8, 3.5, 5)}" fill="#9ab873" opacity="0.8"/>`;
      }
    }
    svg.innerHTML =
      (N > 1 ? `<polygon points="${v.map(p => p.join(',')).join(' ')}" fill="none" stroke="#555" stroke-width="2"/>` : '') +
      eighths +
      v.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === 0 ? 10 : 7}" fill="${i === 0 ? '#506D2F' : '#999'}"/>`).join('') +
      `<g id="metro-marker"><polygon points="${star(0, 0, 20, 9, 6)}" fill="#9ab873" stroke="#506D2F" stroke-width="2"/></g>`;
  }
  const v = metroV;
  let pos = v[0];
  if (phase && v.length) {
    const j = phase.j, nj = (j + 1) % N;
    pos = [v[j][0] + (v[nj][0] - v[j][0]) * phase.frac, v[j][1] + (v[nj][1] - v[j][1]) * phase.frac];
  }
  const m = $('metro-marker');
  if (m) m.setAttribute('transform', `translate(${pos[0]},${pos[1]})`);
}

// 基本の指揮図形: 打点は中央下に1つ(全拍同じ)。apexへ跳ね上げ、左右に少しずつずらし一直線を避ける。
// 手は 打点(下)→ apex(上)→ 次の打点、を繰り返す。a の最後は始点(中央上)へ戻る。x:-1左+1右, y:+1下
function conductorFig(N) {
  const bottoms = Array.from({ length: N }, () => [0, 1]);
  const apex = Array.from({ length: N }, (_, j) => {
    if (j === N - 1) return [0, -0.85];                    // 最後の拍は中央上(始点へ戻る)
    const side = j % 2 === 0 ? -1 : 1;                     // 跳ね上げを左右交互に
    return [side * (0.9 - 0.06 * j), -0.55 + 0.02 * j];   // 横に大きく・少しずつずらす(一直線回避)
  });
  return { bottoms, apex };
}
// Catmull-Rom スプライン: 点列 pts の区間 i(pts[i]→pts[i+1])を t(0-1)で滑らかに補間(閉ループ)。全点を通る
function catmullRom(pts, i, t) {
  const n = pts.length;
  const p0 = pts[(i - 1 + n) % n], p1 = pts[i % n], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
  const t2 = t * t, t3 = t2 * t;
  const cr = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return [cr(p0[0], p1[0], p2[0], p3[0]), cr(p0[1], p1[1], p2[1], p3[1])];
}

// しきくま: パーツ分割スプライト(2360x1640 同一キャンバス)を重ねた立ち絵。各パーツを支点で動かす
let bearSig = '', trailBuf = [];
let sparkT = -1, sparkPos = [0, 0], lastSparkBeat = '', sparkStrong = false;  // 打点のキラッ(発火時刻・位置・直近拍・強拍か)
// 採寸(canvas座標, 推定=要調整): 立ち絵中心(1157,907) / 右腕 肩(990,775)→手先(650,935) / 左腕 肩(1350,860) / 首(1142,840)
const KSC = 0.36;  // キャンバス→SVG の縮尺(立ち絵高さ~1046 を ~380 に)
const KOX = 210 - 1157 * KSC, KOY = 210 - 907 * KSC;  // 立ち絵中心をSVG中央(210,210)へ
const BEAR_T = `translate(${KOX.toFixed(1)},${KOY.toFixed(1)}) scale(${KSC})`;
const toW = (x, y) => [x * KSC + KOX, y * KSC + KOY];  // canvas座標 → SVG(world)座標
const RSHO = [985, 860], RPAW = [660, 815];     // 右腕 肩(右=胴体側の付け根)・手先(左=肉球, canvas)
const LSHO = [1350, 860], NECK = [1142, 840];   // 左腕 肩 / 首=頭の回転支点(canvas)
const PAW_OFF = [8, 34];  // 打点(棒先端)→握り(手先)のオフセット(world)
// 指揮エリア=くまの顔下〜みぞおち(縦長・体のやや左)。手先がこの範囲を動く(肩は固定)。
// START=上が始点, 打点=下。sx/sy=振り幅(condStyle.widthで拡縮)。横は狭め=縦の上下動が主
const FIG = { cx: 150, cy: 230, sx: 110, sy: 92 };
const toXY = p => [FIG.cx + p[0] * FIG.sx, FIG.cy + p[1] * FIG.sy];

// 前拍中の指揮フェーズ(開始小節と同じ拍数で、始点→beat1 の準備を振る)。k=-1
function prePhase(t) {
  const info = meter.measures.find(x => x.index === overlay.measures[cueIndex].index);
  const pulses = info ? measurePulses(info) : [1, 1, 1, 1];
  const spb = 60 / Math.max(20, parseFloat($('tempo').value) || 136);
  let off = playFrom - pulses.reduce((a, b) => a + b, 0) * spb;  // = baseT
  for (let j = 0; j < pulses.length; j++) {
    const d = pulses[j] * spb;
    if (t < off + d) return { k: -1, j, frac: (t - off) / d, pulses };
    off += d;
  }
  return null;
}
// アプリ背景テーマ(marble=明 / leaves=森)を適用。しきくまの色は updateBear が theme に連動して決める
function applyTheme() {
  document.body.classList.toggle('theme-leaves', theme === 'leaves');
  const t = $('theme-toggle'); if (t) t.checked = theme === 'leaves';
  bearSig = '';  // しきくまの色を背景に合わせ再生成させる
}
// 表現スタイル(振りの大きさ/沈み/うなずき/左手/カーブ)。決め打ちをやめパラメータ化。
// ★ここを曲・小節・拍(phase)ごとに AI が決めると「指揮者エージェント」になる(今は既定値)。
// 例: 強拍は width/sink を上げる、フレーズ終わりは curve(ため)を足す、クレッシェンドで徐々に width↑
function condStyle(phase) {
  const strong = !!(phase && phase.j === 0);  // ダウンビート(1拍目)=強拍
  return {
    width: 1,                    // 振り幅(図形スケール)は小節一定(拍ごとに変えると軌道が飛ぶため据え置き)
    sink:  strong ? 1.5 : 0.65,  // 体の沈み込み: 強拍は深く、弱拍は浅く
    nod:   strong ? 1.4 : 0.7,   // うなずき: 強拍は大きく
    cue:   strong ? 1.3 : 0.7,   // 左手: 強拍で動く
    curve: 0,
  };
}
function updateBear(phase) {
  const svg = $('bear-svg');
  const N = phase ? Math.max(1, phase.pulses.length) : 4;
  const fig = conductorFig(N);
  const st = condStyle(phase);  // 表現パラメータ(将来AIが供給)。振り幅などをここで駆動
  const SX = FIG.sx * st.width, SY = FIG.sy * st.width;
  const XY = p => [FIG.cx + p[0] * SX, FIG.cy + p[1] * SY];
  const B = fig.bottoms.map(XY), A = fig.apex.map(XY);
  const START = XY([0, -0.9]);  // 始点=中央上(全拍子共通・固定)
  // Catmull-Rom 用の点列: 打点→apex→打点→apex…(閉ループ)。手先がこれを滑らかになぞる
  const pts = [];
  for (let j = 0; j < N; j++) { pts.push(B[j]); pts.push(A[j]); }
  if (bearSig !== 'fig' + N) {
    bearSig = 'fig' + N;
    // パーツを同一キャンバス(2360x1640)に重ねて立ち絵に。重ね順: 足→胴体→左腕→右腕→頭(顔+目+口)→尾
    // NOTE: 自己終了タグは直前の属性を必ず引用符で囲む("...."/>)。opacity=0.8/> だと /> が閉じ扱いされず不可視化する
    const P = (id, f) => `<image id="${id}" href="images/kuma/${f}" x="0" y="0" width="2360" height="1640" transform="${BEAR_T}"/>`;
    svg.innerHTML =
      P('k-leg-r', 'leg-r.png') + P('k-leg-l', 'leg-l.png') +
      P('k-body', 'body.png') +
      P('k-arm-l', 'arm-l.png') +
      P('k-arm-r', 'arm-r.png') +
      `<g id="k-head">` + P('k-face', 'face.png') + P('k-eyes', 'eyes.png') + P('k-mouth', 'mouth.png') + `</g>` +
      `<polyline id="fig-trail" fill="none" stroke="#ffb24d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>` +
      `<polygon id="fig-spark" points="${star(0, 0, 9, 3.5, 5)}" opacity="0"/>`;  // 打点でキラッと光る
  }
  // 手先の位置 H: 点列を Catmull-Rom で滑らかになぞる。前拍(phase.k<0)も同じ図形で準備を振る
  let H = START;
  if (phase) {
    // 拍j内: 前半=打点→apex(区間2j), 後半=apex→次の打点(区間2j+1)
    const seg = phase.frac < 0.5 ? 2 * phase.j : 2 * phase.j + 1;
    const lt = phase.frac < 0.5 ? phase.frac * 2 : (phase.frac - 0.5) * 2;
    H = catmullRom(pts, seg, lt);
  }
  // 連続する軌跡(コメットの尾)。小節/拍子が変わっても繋がる。瞬間移動しない
  const nowt = performance.now() / 1000;
  if (phase) trailBuf.push([H[0], H[1], nowt]); else trailBuf = [];
  while (trailBuf.length && nowt - trailBuf[0][2] > 0.28) trailBuf.shift();
  $('fig-trail').setAttribute('points', trailBuf.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
  // 打点でキラッ: 新しい拍に入った瞬間だけ、打点位置で一瞬ひかる(常時の星ではない)
  const spark = $('fig-spark');
  if (spark) {
    if (phase) {
      const bk = phase.k + '.' + phase.j;
      if (bk !== lastSparkBeat) { lastSparkBeat = bk; sparkT = nowt; sparkPos = [H[0], H[1]]; sparkStrong = phase.j === 0; }
    }
    const age = sparkT >= 0 ? nowt - sparkT : 9;
    if (age < 0.33) {
      const p = age / 0.33;  // 0→1 で拡大しながらフェード
      spark.setAttribute('fill', theme === 'leaves' ? '#fff' : '#ffb300');
      spark.setAttribute('transform', `translate(${sparkPos[0].toFixed(1)},${sparkPos[1].toFixed(1)}) scale(${(0.4 + p * (sparkStrong ? 2.3 : 1.2)).toFixed(2)}) rotate(${(p * 80).toFixed(0)})`);
      spark.setAttribute('opacity', (0.9 * (1 - p)).toFixed(2));
    } else spark.setAttribute('opacity', '0');
  }
  // 全身の沈み込み(bounce)と頭のうなずき: 打点(frac0)で最も沈む/うなずく。1拍目は深く
  const sinkAmt = ((phase && phase.j === 0) ? 10 : 6) * st.sink;
  const dy = phase ? sinkAmt * (0.5 + 0.5 * Math.cos(2 * Math.PI * phase.frac)) : 0;
  const nod = phase ? (phase.j === 0 ? 5 : 3) * st.nod * (0.5 + 0.5 * Math.cos(2 * Math.PI * phase.frac)) : 0;
  const bt = `translate(0 ${dy.toFixed(1)}) ${BEAR_T}`;
  ['k-leg-r', 'k-leg-l', 'k-body'].forEach(id => { const e = $(id); if (e) e.setAttribute('transform', bt); });
  const neckW = toW(NECK[0], NECK[1]);  // 頭は首を支点にうなずく(+ bounceで一緒に沈む)
  const head = $('k-head');
  if (head) head.setAttribute('transform', `translate(0 ${dy.toFixed(1)}) rotate(${nod.toFixed(2)} ${neckW[0].toFixed(1)} ${neckW[1].toFixed(1)})`);
  // 右腕: 肩(RSHO)支点で、手先(RPAW)が打点Hに乗るよう回転+伸縮。腕の長さは ext=肩→打点距離/元の腕長
  const rshoW = toW(RSHO[0], RSHO[1]), rpawW = toW(RPAW[0], RPAW[1]);
  const base = Math.hypot(rpawW[0] - rshoW[0], rpawW[1] - rshoW[1]);
  const a0 = Math.atan2(rpawW[1] - rshoW[1], rpawW[0] - rshoW[0]);  // 元の肩→手先角
  const armR = $('k-arm-r');
  if (phase) {
    const aH = Math.atan2(H[1] - rshoW[1], H[0] - rshoW[0]);        // 肩→打点角
    const ext = Math.max(0.5, Math.min(1.4, Math.hypot(H[0] - rshoW[0], H[1] - rshoW[1]) / base));  // 腕の伸縮(奥行き)
    const rot = (aH - a0) * 180 / Math.PI;
    if (armR) armR.setAttribute('transform',
      `translate(${rshoW[0].toFixed(1)} ${rshoW[1].toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${ext.toFixed(3)}) translate(${(-rshoW[0]).toFixed(1)} ${(-rshoW[1]).toFixed(1)}) ${BEAR_T}`);
  } else {
    if (armR) armR.setAttribute('transform', BEAR_T);  // 静止ポーズ
  }
  // 左腕: 肩(LSHO)を支点に、拍で軽くキュー(ダウンビートで少し上げる)
  const armL = $('k-arm-l'), lshoW = toW(LSHO[0], LSHO[1]);
  const swing = phase ? (phase.j === 0 ? -10 : -4) * st.cue * (0.5 + 0.5 * Math.cos(2 * Math.PI * phase.frac)) : 0;
  if (armL) armL.setAttribute('transform', `rotate(${swing.toFixed(2)} ${lshoW[0].toFixed(1)} ${lshoW[1].toFixed(1)}) ${BEAR_T}`);
}

// metro/bear ビューで楽譜ミニストリップを描画(今の段をキャンバスに切り出しハイライト)
// k: overlay.measures の配列インデックス(-1=開始前), inPre: 前振り中か
function updateScoreMini(k, inPre) {
  const canvas = $('score-strip');
  if (!canvas || !overlay) return;
  const scoreImg = $('score');
  const imgReady = scoreImg.complete && scoreImg.naturalWidth > 0;
  const key = `${k}|${inPre}`;
  const label = $('strip-label');
  if (label && key !== lastStripKey) {
    label.textContent = inPre
      ? `(前振り ${$('preN').value}拍)`
      : k >= 0 ? `小節 ${k + 1} / ${overlay.measures.length}` : '';
  }
  if (!imgReady || key === lastStripKey) return;
  lastStripKey = key;

  const idx = k >= 0 ? k : cueIndex;
  const m0 = overlay.measures[idx] ?? overlay.measures[0];
  if (!m0) return;
  // 現在小節の段の上下。上は詰め(別段の写り込み回避)、下は音符・スラーのぶん広め(段高比)
  const ys0 = m0.points.map(p => p[1]);
  const minY = Math.min(...ys0), maxY = Math.max(...ys0), yrange = maxY - minY;
  const sy = Math.max(0, Math.round(minY - yrange * 0.12));
  const shh = Math.min(overlay.height - sy, Math.round(maxY + yrange * 0.6) - sy);
  // 元写真の傾きを打ち消す: 現在小節の上辺の角度ぶん、描画時に逆回転して水平化する
  const [tl, tr] = [m0.points[0], m0.points[1]];
  const theta = Math.atan2(tr[1] - tl[1], tr[0] - tl[0]);

  // 音符の拡大率は「段高→固定表示高さ dispH」で決定(端末によらずほぼ一定=間延びしない)。
  // 横は端末幅いっぱいぶんを現在小節中心に切り出す(PCは前後が多く、スマホは少なく写る)。
  const dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, canvas.offsetWidth);
  const dispH = window.matchMedia('(max-width: 700px)').matches ? 104 : 132;
  const scale = dispH / shh;
  let srcW = W / scale;
  const mcx = m0.points.reduce((s, p) => s + p[0], 0) / 4;  // 現在小節の中心x
  let sx;
  if (srcW >= overlay.width) { srcW = overlay.width; sx = 0; }
  else sx = Math.max(0, Math.min(mcx - srcW / 2, overlay.width - srcW));

  canvas.width = W * dpr; canvas.height = dispH * dpr;
  canvas.style.height = dispH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  // キャンバス中心を軸に -theta 回転 → 傾いた譜面が水平に見える(ポリゴンも同じ変換下で整合)
  ctx.translate(W / 2, dispH / 2);
  ctx.rotate(-theta);
  ctx.translate(-W / 2, -dispH / 2);
  ctx.drawImage(scoreImg, sx, sy, srcW, shh, 0, 0, W, dispH);

  // 写っている小節に枠(現在小節は濃いオレンジ、他は薄く)
  overlay.measures.forEach(m => {
    const mxs = m.points.map(p => p[0]);
    if (Math.max(...mxs) < sx || Math.min(...mxs) > sx + srcW) return;  // 範囲外は描かない
    const isActive = !inPre && k >= 0 && m.index === overlay.measures[k].index;
    ctx.beginPath();
    m.points.forEach(([x, y], i) => {
      const px = (x - sx) * scale, py = (y - sy) * scale;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.closePath();
    if (isActive) { ctx.fillStyle = 'rgba(255,120,0,0.32)'; ctx.fill(); }
    ctx.strokeStyle = isActive ? '#506D2F' : 'rgba(80,109,47,0.45)';
    ctx.lineWidth = isActive ? 3 : 1.5;
    ctx.stroke();
  });
}

function switchView(v) {
  $('score-wrap').classList.toggle('hidden', v !== 'score');
  $('metro-view').classList.toggle('hidden', v !== 'metro');
  $('bear-view').classList.toggle('hidden', v !== 'bear');
  $('transport').classList.toggle('hidden', v === 'score');
  $('score-mini').classList.toggle('hidden', v === 'score');
  if (v !== 'score' && overlay) { lastStripKey = ''; updateScoreMini(current >= 0 ? current : cueIndex, false); }
  if (v === 'metro') { metroSig = ''; updateMetro(null); }
  if (v === 'bear') { bearSig = ''; trailBuf = []; updateBear(null); }
}

function highlight(t) {
  let i = -1;
  for (let k = 0; k < measureStarts.length; k++) {
    if (measureStarts[k] !== null && measureStarts[k] <= t) i = k;
    else if (measureStarts[k] !== null) break;
  }
  if (i === current) return;
  current = i;
  document.querySelectorAll('polygon').forEach(p => p.classList.toggle('active', +p.dataset.i === i));
  const el = document.querySelector('polygon.active');
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function currentTime() {
  if ($('src').value === 'solo') return playing ? baseT + (now() - playStart) : null;
  return (player && player.getCurrentTime) ? player.getCurrentTime() : null;
}

function tick() {
  let t = currentTime();
  if (t !== null) {
    // 範囲ループ: Bの終わりまで来たらAの頭に戻す
    if ($('loop').checked) {
      const [ls, le] = loopRange();
      if (t >= le) { jumpTo(ls); t = ls; }
    }
    const solo = $('src').value === 'solo';
    const inPre = solo && t < playFrom;  // 前拍中(本編の手前)
    // 前拍中は小節を光らせない
    if (inPre) {
      if (current !== -1) { current = -1; document.querySelectorAll('polygon.active').forEach(p => p.classList.remove('active')); }
    } else {
      highlight(t);
    }
    const view = $('view').value;  // メトロノーム/しきくまの図形も同じ拍で動かす
    if (view === 'metro') updateMetro(inPre ? null : beatPhase(t));
    else if (view === 'bear') updateBear(inPre ? prePhase(t) : beatPhase(t));  // 前拍も指揮(始点→beat1の準備)
    if (view === 'metro' || view === 'bear') updateScoreMini(inPre ? cueIndex : current, inPre);
    // 単体(練習)は Web Audio スケジューラで正確に予約(下の setInterval)。ここは YouTube同期用
    if (!solo) {
      if (t < lastT - 0.1) { nextClick = clicks.findIndex(c => c.t > t); if (nextClick < 0) nextClick = clicks.length; }
      lastT = t;
      if ($('snd').checked) {
        while (nextPre < preClicks.length && preClicks[nextPre] <= t) {
          if (t - preClicks[nextPre] < 0.2) click(false);
          nextPre++;
        }
        while (nextClick < clicks.length && clicks[nextClick].t <= t) {
          if (t - clicks[nextClick].t < 0.2) click(clicks[nextClick].accent);
          nextClick++;
        }
      }
    }
    if (solo && t < playFrom) {
      $('status').textContent = '♪ 前拍…';
    } else {
      const info = current >= 0 ? meter.measures.find(x => x.index === current) : null;
      $('status').textContent =
        `${solo ? '' : t.toFixed(1) + 's / '}小節 ${current + 1}/${overlay.measures.length}  ${info ? info.ts : ''}`;
    }
  }
  updatePlayUI();
  requestAnimationFrame(tick);
}

// 単体(練習)の拍を Web Audio で先読み予約(ジッタの少ない正確な発音)
setInterval(() => {
  if (!playing || !actx || $('src').value !== 'solo') return;
  const t = baseT + (now() - playStart);
  const ahead = t + 0.12;  // 120ms 先まで予約
  const snd = $('snd').checked;
  while (nextPre < preClicks.length && preClicks[nextPre] < ahead) {
    if (snd) click(false, audioTime(preClicks[nextPre]));
    nextPre++;
  }
  while (nextClick < clicks.length && clicks[nextClick].t < ahead) {
    if (snd) click(clicks[nextClick].accent, audioTime(clicks[nextClick].t));
    nextClick++;
  }
}, 25);

// YouTube の URL(watch?v=, youtu.be/, embed/ など)から動画IDを取り出す。IDそのままもOK
function videoId(input) {
  const s = (input || '').trim();
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|\/v\/|shorts\/)([\w-]{11})/) || s.match(/^([\w-]{11})$/);
  return m ? m[1] : s;
}

function makePlayer(input) {
  $('player').innerHTML = '<div id="yt"></div>';
  player = new YT.Player('yt', { width: 400, height: 225, videoId: videoId(input) });
}
function startAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
}

// ---- イベント ----
$('analyze').onclick = async () => {
  const f = $('file').files[0];
  if (!f) { $('up-status').textContent = '写真を選んでください'; return; }
  $('analyze').disabled = true;
  try {
    // 前段: 小節検出 + triage(開始の拍子・テンポが読めるか)。約10秒
    $('up-status').textContent = '小節を検出中…';
    const fd = new FormData(); fd.append('file', f);
    const res = await fetch('/process/detect', { method: 'POST', body: fd });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const first = await res.json();
    currentJob = first.job; currentPiece = null; currentPieceName = autoName();
    startInfo = first.start || null;

    // 読めなかった項目だけ人に聞く。答えは後段のプロンプトに渡るので、AIは推測せずに済む
    let answer = {};
    if (startInfo && startInfo.status === 'ask') {
      $('up-status').textContent = 'わからないところがあるっくま…';
      answer = await askStart(startInfo);
    }

    // 後段: 全小節の拍子・テンポを読む。数十秒
    $('up-status').textContent = '解析中… (Geminiが拍子とテンポを読み取り、数十秒)';
    const res2 = await fetch(`/process/read/${first.job}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(answer),
    });
    if (!res2.ok) throw new Error((await res2.json()).error || res2.statusText);
    const data = await res2.json();
    startInfo = data.start || startInfo;
    initFromData(data.image, data.overlay, data.meter, null);
    savePiece();  // 解析したら自動でライブラリに保存(未保存状態を作らない)
  } catch (e) {
    $('up-status').textContent = '解析に失敗: ' + e.message;
  } finally {
    $('analyze').disabled = false;
  }
};

// 小節k(通し番号)の拍の長さ配列(4分換算)
function pulsesAt(k) {
  const info = meter.measures.find(x => x.index === overlay.measures[k].index);
  return info ? measurePulses(info) : [1, 1, 1, 1];
}
// 単体(練習)を小節k(本編=その小節の頭)から再生開始。前拍は「その小節と同じ拍」を手前に鳴らす
function startSolo(k) {
  const time = measureStarts[k] ?? 0;
  const tempo = Math.max(20, parseFloat($('tempo').value) || 136);
  const spb = 60 / tempo;
  playFrom = time;                         // ここから本編(小節ハイライト開始)
  preClicks = [];
  if ($('pre').checked) {
    const pulses = pulsesAt(k);            // 開始小節と同じ拍(数・刻み)を前拍に
    let off = -pulses.reduce((a, b) => a + b, 0);
    pulses.forEach(dur => { preClicks.push(time + off * spb); off += dur; });
    $('preN').value = pulses.length;       // 表示を合わせる
  }
  nextPre = 0;
  playing = true;
  baseT = preClicks.length ? preClicks[0] : time;  // 前拍ぶん手前から時計を回す
  playStart = now();
  audioStart = actx ? actx.currentTime : 0;  // この瞬間を音の基準に(先読み予約)
  current = -1;
  nextClick = clicks.findIndex(c => c.t >= playFrom);  // 本編の手前の小節クリックは鳴らさない
  if (nextClick < 0) nextClick = clicks.length;
  lastT = baseT;
}

function isPlaying() {
  return $('src').value === 'solo' ? playing
    : (player && player.getPlayerState && player.getPlayerState() === 1);
}
function clearCue() { document.querySelectorAll('polygon.cue').forEach(p => p.classList.remove('cue')); }
// 開始小節を選ぶ(緑表示)。まだ再生はしない
function setCue(idx) {
  cueIndex = overlay.measures.findIndex(m => m.index === idx);
  $('preN').value = pulsesAt(cueIndex).length;  // 前拍の拍数を開始小節に合わせて表示
  clearCue();
  const p = $('ov').querySelector(`polygon[data-i="${idx}"]`);
  if (p) p.classList.add('cue');
}
// 選んだ小節(通し番号k)から再生(前拍も入る)
function playFromOrdinal(k) {
  startAudio();
  pausedAt = null;  // 頭から/途中からの再生開始なので一時停止位置は破棄
  clearCue();
  const t = measureStarts[k] ?? 0;
  if ($('src').value === 'solo') {
    startSolo(k);
  } else if (player && player.seekTo) {
    current = -1; lastT = t; preClicks = []; nextPre = 0;
    nextClick = clicks.findIndex(c => c.t >= t); if (nextClick < 0) nextClick = clicks.length;
    player.seekTo(t, true); player.playVideo();
  }
}

// 再生 / 一時停止 / 再開 のトグル(大きいボタン・ヘッダーの▶ 共通)
function togglePlay() {
  startAudio();
  if ($('src').value === 'solo') {
    if (playing) pauseSolo();
    else if (pausedAt != null) resumeSolo();   // 続きから
    else playFromOrdinal(cueIndex);            // 選んだ小節から頭出し再生
  } else {
    if (isPlaying()) { if (player) player.pauseVideo(); }
    else if (player && player.playVideo) player.playVideo();
    else playFromOrdinal(cueIndex);
  }
  updatePlayUI();
}
// 単体(練習)の一時停止: 今の時刻を覚えて止める(ハイライトは固定のまま)
function pauseSolo() {
  pausedAt = currentTime();
  playing = false;
}
// 単体(練習)の再開: 覚えた時刻から時計を動かし直す(前拍はやり直さない)
function resumeSolo() {
  const t = pausedAt; pausedAt = null;
  baseT = t; playStart = now(); audioStart = actx ? actx.currentTime : 0;
  nextClick = clicks.findIndex(c => c.t >= t); if (nextClick < 0) nextClick = clicks.length;
  nextPre = preClicks.findIndex(x => x >= t); if (nextPre < 0) nextPre = preClicks.length;
  lastT = t; current = -1; playing = true;
}
// 再生ボタンの見た目を状態に合わせる(毎フレーム呼ぶが、変化時だけ描く)
function updatePlayUI() {
  const on = isPlaying();
  const key = on + '|' + (pausedAt != null) + '|' + $('preN').value;
  if (key === lastUI) return;
  lastUI = key;
  const label = on ? '⏸一時停止' : (pausedAt != null ? '▶再開' : '▶再生');
  if ($('play')) $('play').textContent = label;
  const bp = $('big-play');
  if (bp) { bp.textContent = on ? '⏸' : '▶'; bp.classList.toggle('playing', on); }
  if ($('big-preN')) $('big-preN').textContent = $('preN').value;
}

// 補正パネルをタイトルでドラッグして動かせる(邪魔な時に移動)
(function () {
  const ed = $('editor'), h = $('e-title');
  let dx = 0, dy = 0, dragging = false;
  h.addEventListener('mousedown', e => {
    dragging = true; dx = e.clientX - ed.offsetLeft; dy = e.clientY - ed.offsetTop; e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    ed.style.left = (e.clientX - dx) + 'px';
    ed.style.top = (e.clientY - dy) + 'px';
    ed.style.right = 'auto'; ed.style.bottom = 'auto';
  });
  window.addEventListener('mouseup', () => dragging = false);
})();

// ---- 自動保存(未保存状態を作らない。解析=即ライブラリ入り、補正は都度保存) ----
function autoName() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `無題 ${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// 補正(枠+拍子)を保存。実ジョブはサーバ(corrected)、サンプルは localStorage。連続操作はまとめる
let saveTimer = null;
function persist() {
  const body = { meter, overlay };
  if (!currentJob) { localStorage.setItem('kuma_save_' + currentImage, JSON.stringify(body)); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch('/save/' + currentJob, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  }, 700);
}
// 曲(piece)として保存/更新。解析直後に自動で作り(仮名)、以降はリネームで名前を更新
async function savePiece() {
  if (!currentJob) { persist(); return; }  // サンプルは localStorage のみ
  try {
    await fetch('/save/' + currentJob, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ meter, overlay }) });
    const res = await fetch('/piece', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentPiece, name: currentPieceName || autoName(), pages: [currentJob] }),
    });
    currentPiece = (await res.json()).id;
    updateURL();
  } catch (e) { /* 失敗は次の操作で再試行 */ }
}
// 名前の変更(💾→✏)。いつでもリネームできる

  currentPieceName = name || currentPieceName || autoName();

  $('tool-hint').textContent = `「${currentPieceName}」に変更しました`;
};

$('tempo').oninput = () => { computeTimeline(); current = -1; $('big-bpm').textContent = $('tempo').value; };
$('view').onchange = () => { switchView($('view').value); updateURL(); };
// アプリ背景テーマの切替(明るい ⇄ 森)
$('theme-toggle').onclick = () => {
  theme = $('theme-toggle').checked ? 'leaves' : 'marble';
  localStorage.setItem('kuma_theme', theme);
  applyTheme();
  updateBear(null);
};
// 設定ポップアップ
$('settings-btn').onclick = () => $('settings-popup').classList.remove('hidden');
$('settings-close').onclick = () => $('settings-popup').classList.add('hidden');
$('settings-popup').onclick = (e) => { if (e.target.id === 'settings-popup') $('settings-popup').classList.add('hidden'); };
// ハンバーガーメニュー
$('menu-btn').onclick = (e) => { e.stopPropagation(); $('ham-menu').classList.toggle('hidden'); };
document.addEventListener('click', () => $('ham-menu').classList.add('hidden'));
$('ham-review').onclick = () => { enterReview(); };
$('ham-back').onclick = () => {
  playing = false;
  document.body.classList.remove('review-mode');
  currentJob = null; currentPiece = null; currentPieceName = '';
  history.replaceState(null, '', location.pathname);
  $('app').classList.add('hidden'); $('upload').classList.remove('hidden');
  $('up-status').textContent = '';
  loadLibrary();
};

// 調節: ツール切替 / モード切替 / 戻す
['edit', 'split', 'merge'].forEach(t => $('tool-' + t).onclick = () => setReviewTool(t));
$('to-play').onclick = enterPlay;
$('to-review').onclick = enterReview;
$('undo').onclick = undo;
// Ctrl/Cmd+Z で戻す(調節画面でテキスト入力中以外)
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && appMode === 'review'
      && !/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) {
    e.preventDefault(); undo();
  }
});

// 起動時: テーマ適用 + ライブラリ(保存した曲)を表示。URL に ?piece / ?job があればプレイヤーへ復元
applyTheme();
// メトロノーム音は初期オフ。設定で有効化し localStorage に記憶
if (localStorage.getItem('kuma_snd') === '1') $('snd').checked = true;
$('snd').onchange = () => localStorage.setItem('kuma_snd', $('snd').checked ? '1' : '0');
loadLibrary();
const params = new URLSearchParams(location.search);
// 再生ビュー(譜読み/メトロノーム/しきくま)を先に反映 → enterPlay の switchView で復元される
const savedView = params.get('view');
if (savedView && ['score', 'metro', 'bear'].includes(savedView)) $('view').value = savedView;
if (params.get('piece')) loadPiece(params.get('piece'));
else if (params.get('job')) loadFromJob(params.get('job'));
</script>
</body>
</html>
